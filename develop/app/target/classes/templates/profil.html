{{HEADER}}

<main>
    <div id="main_wrapper">
        <div class="profile-container">
            <!-- Profile Header -->
            <div class="profile-header">
                <div class="profile-avatar">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="profile-header-info">
                    <h1>{{USER_NAME}}</h1>
                    <p class="user-type-badge">{{USER_TYPE}}</p>
                </div>
            </div>

            <!-- Profile Details -->
            <div class="profile-details">
                <div class="detail-item">
                    <i class="fa-solid fa-envelope"></i>
                    <div class="detail-content">
                        <span class="detail-label">E-post</span>
                        <span class="detail-value">{{USER_EMAIL}}</span>
                    </div>
                </div>

                <div class="detail-item">
                    <i class="fa-solid fa-phone"></i>
                    <div class="detail-content">
                        <span class="detail-label">Telefonnummer</span>
                        <span class="detail-value">{{USER_PHONE}}</span>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="profile-actions">
                <a href="/logout" class="btn btn-logout">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logg ut
                </a>
            </div>
        </div>

        <style>
            .profile-container {
                max-width: 600px;
                margin: 0 auto;
            }

            .profile-header {
                background: linear-gradient(135deg, #2C3E50 0%, #3498DB 100%);
                color: white;
                padding: 3rem 2rem;
                border-radius: 12px 12px 0 0;
                text-align: center;
                position: relative;
            }

            .profile-avatar {
                width: 100px;
                height: 100px;
                background: rgba(255, 255, 255, 0.2);
                border: 4px solid rgba(255, 255, 255, 0.3);
                border-radius: 50%;
                margin: 0 auto 1.5rem;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 3rem;
                color: white;
            }

            .profile-header-info h1 {
                margin: 0 0 0.5rem 0;
                font-size: 1.8rem;
                font-weight: 600;
            }

            .user-type-badge {
                display: inline-block;
                background: rgba(255, 255, 255, 0.2);
                padding: 0.4rem 1rem;
                border-radius: 20px;
                font-size: 0.9rem;
                font-weight: 500;
                margin: 0;
            }

            .profile-details {
                background: white;
                padding: 2rem;
                border-radius: 0 0 12px 12px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            }

            .detail-item {
                display: flex;
                align-items: center;
                padding: 1.5rem 0;
                border-bottom: 1px solid #ECF0F1;
            }

            .detail-item:last-child {
                border-bottom: none;
            }

            .detail-item i {
                font-size: 1.5rem;
                color: #3498DB;
                width: 40px;
                text-align: center;
                margin-right: 1.5rem;
            }

            .detail-content {
                display: flex;
                flex-direction: column;
                flex: 1;
            }

            .detail-label {
                font-size: 0.85rem;
                color: #7F8C8D;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                margin-bottom: 0.3rem;
                font-weight: 500;
            }

            .detail-value {
                font-size: 1.1rem;
                color: #2C3E50;
                font-weight: 500;
            }

            .profile-actions {
                margin-top: 2rem;
            }

            .btn-logout {
                width: 100%;
                background: #E74C3C;
                color: white;
                padding: 1rem 2rem;
                border: none;
                border-radius: 8px;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 0.5rem;
                transition: all 0.3s ease;
                text-decoration: none;
            }

            .btn-logout:hover {
                background: #C0392B;
                transform: translateY(-2px);
                box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3);
            }

            .btn-logout i {
                font-size: 1.1rem;
            }

            @media (max-width: 768px) {
                .profile-header {
                    padding: 2rem 1rem;
                }

                .profile-avatar {
                    width: 80px;
                    height: 80px;
                    font-size: 2.5rem;
                }

                .profile-header-info h1 {
                    font-size: 1.5rem;
                }

                .profile-details {
                    padding: 1.5rem;
                }

                .detail-item {
                    padding: 1rem 0;
                }

                .detail-item i {
                    font-size: 1.3rem;
                    width: 35px;
                    margin-right: 1rem;
                }
            }
        </style>
    </div>
</main>

{{FOOTER}}
